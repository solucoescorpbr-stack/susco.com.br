<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Pagina nao encontrada | Susco</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#1e2d3d;color:#e2eaf5;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    .num{font-family:'Syne',sans-serif;font-size:clamp(6rem,20vw,10rem);font-weight:800;color:rgba(255,255,255,.06);line-height:1;letter-spacing:-.06em;}
    h1{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:#fff;margin-top:-.5rem;}
    p{color:rgba(226,234,245,.4);font-weight:300;margin:1rem 0 2rem;font-size:.9rem;}
    a{border:1px solid rgba(255,255,255,.25);color:#fff;padding:.7rem 1.8rem;border-radius:6px;font-size:.82rem;text-decoration:none;transition:background .2s;letter-spacing:.04em;}
    a:hover{background:rgba(255,255,255,.07);}
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>Pagina nao encontrada</h1>
  <p>O endereco que voce acessou nao existe ou foi movido.</p>
  <a href="/">Voltar ao inicio</a>
</body>
</html>
