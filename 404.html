<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Pagina nao encontrada | Susco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0e14; --accent: #00c2ff; --text: #e8eaf0; --muted: #7a8599;
      --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 2rem;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,194,255,.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,194,255,.03) 1px,transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }
    .num { font-family: var(--font-head); font-size: clamp(6rem,20vw,12rem); font-weight: 800; color: rgba(0,194,255,.12); line-height: 1; letter-spacing: -.06em; }
    h1 { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; color: #fff; margin-top: -.5rem; }
    p { color: var(--muted); font-weight: 300; margin: 1rem 0 2rem; }
    a {
      background: var(--accent); color: #0b0e14; padding: .85rem 2rem; border-radius: 6px;
      font-weight: 600; font-size: .95rem; text-decoration: none; display: inline-block;
      transition: opacity .2s;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>Pagina nao encontrada</h1>
  <p>O endereco que voce acessou nao existe ou foi movido.</p>
  <a href="/">Voltar ao inicio</a>
</body>
</html>
